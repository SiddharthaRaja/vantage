[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vantage"
version = "0.1.0"
description = "A serving-performance and quality benchmark harness for LLM inference backends."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Sidhartha Tammana" }]
keywords = ["llm", "inference", "benchmark", "vllm", "serving", "latency", "rag"]

dependencies = [
  "httpx>=0.27",
  "numpy>=1.26",
  "pydantic>=2.6",
  "typer>=0.12",
  "rich>=13.7",
  "PyYAML>=6.0",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5", "pytest-cov>=5.0"]
embeddings = ["sentence-transformers>=3.0"]
tokenizers = ["tiktoken>=0.7", "transformers>=4.44"]
finetune = [
  "torch>=2.4",
  "transformers>=4.44",
  "trl>=0.11",
  "peft>=0.12",
  "bitsandbytes>=0.43",
  "datasets>=2.20",
  "accelerate>=0.33",
]

[project.scripts]
vantage = "vantage.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]
ignore = ["E501", "B008"]
