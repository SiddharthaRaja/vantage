# Qwen3-4B-Instruct-2507 on vLLM, fp16, one Kaggle T4 (GPU 0, port 8000).
# The T4 has no bf16, so --dtype half. Started by notebooks/vantage_kaggle.ipynb:
#   CUDA_VISIBLE_DEVICES=0 vllm serve Qwen/Qwen3-4B-Instruct-2507 --dtype half \
#     --max-model-len 4096 --gpu-memory-utilization 0.90 --enable-prefix-caching --port 8000
# Vectora prompts are ~900 tokens with the system prompt and answers <= 256, so
# 4096 never truncates; the KV cache size depends on memory, not on this limit.
type: vllm
name: vllm-qwen3-4b-fp16-t4
model: Qwen/Qwen3-4B-Instruct-2507
base_url: ${VLLM_BASE_URL:-http://localhost:8000/v1}
api_key_env: VLLM_API_KEY
timeout_s: 600
max_retries: 0
scrape_metrics: true      # poll vLLM's /metrics during each run (KV cache, queue, preemptions)
pricing:
  kind: self_hosted
  gpu_hourly_usd: ${GPU_HOURLY_USD:-0.35}
  n_gpus: 1
  note: "assumed on-demand price for one T4; the Kaggle run itself was free"
