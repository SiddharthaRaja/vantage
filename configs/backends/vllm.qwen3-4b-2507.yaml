# Qwen3-4B-Instruct-2507 (non-thinking) on vLLM, bf16, on a rented GPU
# (A10G 24 GB or RTX 4090 24 GB). On the GPU box:
#   vllm serve Qwen/Qwen3-4B-Instruct-2507 --dtype bfloat16 --max-model-len 8192 \
#     --gpu-memory-utilization 0.90 --enable-prefix-caching --port 8000 --api-key $VLLM_API_KEY
# From the client machine: export VLLM_BASE_URL=http://<gpu-box-ip>:8000/v1
# and GPU_HOURLY_USD to what the instance actually costs.
type: vllm
name: vllm-qwen3-4b-bf16
model: Qwen/Qwen3-4B-Instruct-2507
base_url: ${VLLM_BASE_URL:-http://localhost:8000/v1}
api_key_env: VLLM_API_KEY
timeout_s: 300
max_retries: 0
pricing:
  kind: self_hosted
  gpu_hourly_usd: ${GPU_HOURLY_USD:-0.0}
  n_gpus: 1
  note: "set GPU_HOURLY_USD to the instance's real hourly price before running"
