# Does AWQ int4 pay for itself? Same model, same concurrency, same workload;
# the quality gate compares AWQ against bf16 on the held-out eval set with
# hand-written references (data/eval.handwritten.jsonl, scripts/references.py).
# Both servers run at once on the one 24 GB GPU (bf16 ~8 GB of weights, AWQ
# ~2.5 GB), each with a share of memory, on ports 8000 and 8001:
#   vllm serve Qwen/Qwen3-4B-Instruct-2507 --dtype bfloat16 --max-model-len 8192 \
#     --gpu-memory-utilization 0.55 --port 8000 --api-key $VLLM_API_KEY &
#   vllm serve cyankiwi/Qwen3-4B-Instruct-2507-AWQ-4bit --max-model-len 8192 \
#     --gpu-memory-utilization 0.33 --port 8001 --api-key $VLLM_API_KEY &
# Client: VLLM_BASE_URL=http://<ip>:8000/v1 and VLLM_AWQ_BASE_URL=http://<ip>:8001/v1
# Each server gets a smaller KV cache than it would alone, so take SPEED from
# the gpu-concurrency-* sweeps and QUALITY from this one.
#   vantage sweep -c configs/sweeps/gpu-quantization.yaml
name: gpu-quantization
description: bf16 vs AWQ int4, Qwen3-4B-Instruct-2507 on vLLM, rented 24 GB GPU, quality-gated on hand-written references.
workload: data/workload.vectora.jsonl
cooldown_s: 5

slo: { ttft_p95_s: 1.0, total_p95_s: 8.0 }

defaults:
  max_tokens: 192
  load: { mode: closed, concurrency: 16, n_requests: 160, warmup_requests: 16, seed: 7 }

runs:
  - { id: bf16, group: bf16, label: Qwen3-4B bf16, backend: vllm.qwen3-4b-2507 }
  - { id: awq,  group: awq,  label: Qwen3-4B AWQ int4, backend: vllm.qwen3-4b-2507-awq }

quality:
  enabled: true
  baseline: bf16
  max_drop: 0.02
  eval_file: data/eval.handwritten.jsonl

cost:
  api_reference: openai.gpt-4o-mini
  self_hosted_reference: vllm.qwen3-4b-2507
