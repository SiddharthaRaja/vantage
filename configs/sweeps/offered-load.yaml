# Open-loop sweep: Poisson arrivals at a fixed rate, regardless of whether the
# server keeps up. This is the one that finds the cliff. Expect latency to be
# flat and boring until it suddenly is not.
name: offered-load
description: Open-loop (Poisson) offered-load sweep; finds the saturation cliff.
workload: data/workload.sample.jsonl
cooldown_s: 5

slo:
  ttft_p95_s: 1.0
  total_p95_s: 10.0

defaults:
  max_tokens: 128
  load:
    mode: open
    distribution: poisson
    duration_s: 30
    warmup_requests: 10
    max_in_flight: 512
    seed: 7

runs:
  - id: fp16-open
    group: fp16
    label: 7B fp16, Poisson arrivals
    backend: sim.fp16
    matrix:
      load.rate_qps: [1, 2, 4, 6, 8, 10, 14, 18]
